[package]
name = "synth"
version = "0.0.0"
edition = "2021"
authors = ["Lauda Carly <lauda@nel.re"]
description = "Simple rust synthesizer"
readme = "README.md"
repository = "https://github.com/n-e-l/synth"
license = "GPL-3.0-only"
keywords = ["compute", "vulkan", "render", "engine", "synth"]
categories = ["rendering::engine"]

[dependencies]
cen = { git = "https://github.com/n-e-l/cen", rev = "62ed91da74058bb8401d1d3e03b45a1a4d658cb2" }
cpal = "0.13.4"
bytemuck = { version = "1.17.0", features = ["derive"] }
egui_plot = "0.34.1"
egui_code_editor = "=0.2.21"
rfd = "0.17.2"
ringbuf = "0.4.8"
minmaxlttb = "0.1.4"

[dev-dependencies]
