[package]
name = "synth"
version = "0.0.0"
edition = "2021"
authors = ["Lauda Carly <lauda@nel.re"]
description = "Simple rust synthesizer"
readme = "README.md"
repository = "https://github.com/n-e-l/synth"
license = "GPL-3.0-only"
keywords = ["compute", "vulkan", "render", "engine", "synth"]
categories = ["rendering::engine"]

[dependencies]
cen = { git = "https://github.com/n-e-l/cen", rev = "0215ed296e2469f6339bbc493799a657c084649c" }
cpal = "0.13.4"
bytemuck = { version = "1.17.0", features = ["derive"] }
egui_code_editor = "=0.2.21"
rfd = "0.17.2"
ringbuf = "0.4.8"

[dev-dependencies]
